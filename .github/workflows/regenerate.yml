name: Regenerate Catalogs
on:
  push:
    branches: [main]
    paths: ['skills/**', 'scripts/**', 'references/**', 'package.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: regenerate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Regenerate catalogs and lockfile
        run: bash scripts/regenerate.sh
      - name: Prepare changes for maintainer review
        run: |
          artifacts=()
          while IFS= read -r line || [[ -n "$line" ]]; do
            [[ -z "$line" || "$line" == \#* ]] && continue
            artifacts+=("$line")
          done < scripts/generated-artifacts.txt
          git diff --binary -- "${artifacts[@]}" > regeneration.patch
          if [ -s regeneration.patch ]; then
            echo 'Generated changes are attached as a patch. Review and submit them through a pull request.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Generated artifacts are current.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: catalog-regeneration-patch
          path: regeneration.patch
          retention-days: 7
